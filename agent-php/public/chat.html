<!doctype html><html><head>
<script>
/* ------------------------------------------------------------------ *
 * API base resolution.
 *
 * The server injects window.__API_BASE__ before this runs:
 *   ''                  app owns the domain root, rewriting works
 *   '/agent'            installed in a subdirectory
 *   '/agent/index.php'  host has no URL rewriting
 *
 * When the page itself was fetched as a plain directory URL we cannot know
 * server-side whether rewriting works, so the first API call that comes back
 * as a non-JSON 404 (i.e. the web server's own error page) is retried once
 * through the front controller, and the working prefix is remembered.
 * ------------------------------------------------------------------ */
(function () {
  var KEY = 'arena_api_base';
  try {
    var saved = sessionStorage.getItem(KEY);
    if (saved !== null && !window.__API_BASE__) window.__API_BASE__ = saved;
  } catch (e) { /* private mode */ }
  if (typeof window.__API_BASE__ !== 'string') window.__API_BASE__ = '';

  window.apiUrl = function (p) {
    var b = window.__API_BASE__ || '';
    if (!p) return b || '/';
    if (/^[a-z]+:\/\//i.test(p)) return p;
    if (p.charAt(0) !== '/') p = '/' + p;
    return b + p;
  };

  // Alternate prefix to try when the current one 404s at the web-server level.
  function frontControllerBase() {
    var b = window.__API_BASE__ || '';
    if (/index\.php$/.test(b)) return null;          // already using it
    var dir = b.replace(/\/+$/, '');
    return dir + '/index.php';
  }

  var nativeFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var isApi = typeof url === 'string' && /(^|\/)api\//.test(url) && !/^[a-z]+:\/\//i.test(url);
    var p = nativeFetch(input, init);
    if (!isApi || (init && init.__arenaRetry)) return p;
    return p.then(function (res) {
      if (res.status !== 404) return res;
      var ct = res.headers.get('content-type') || '';
      if (ct.indexOf('application/json') !== -1) return res;   // a real API 404
      var alt = frontControllerBase();
      if (alt === null) return res;
      // Rebuild the URL against the front controller and try once.
      var base = window.__API_BASE__ || '';
      var rest = base && url.indexOf(base) === 0 ? url.slice(base.length) : url;
      var retryInit = Object.assign({}, init || {}, { __arenaRetry: true });
      return nativeFetch(alt + rest, retryInit).then(function (res2) {
        if (res2.ok || (res2.headers.get('content-type') || '').indexOf('application/json') !== -1) {
          window.__API_BASE__ = alt;
          try { sessionStorage.setItem(KEY, alt); } catch (e) { /* ignore */ }
          return res2;
        }
        return res;
      }).catch(function () { return res; });
    });
  };
})();
</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arena Agent Chat v0.3.0</title><style>body{margin:0;background:#09111f;color:#e8eef8;font:14px system-ui}main{max-width:1000px;margin:auto;height:100vh;display:flex;flex-direction:column;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #26344a;padding-bottom:15px}.top a{color:#8eb2ff}.controls{display:flex;gap:8px;margin:15px 0}.controls select{background:#121e31;color:#fff;border:1px solid #30425e;border-radius:7px;padding:9px;flex:1}.messages{flex:1;overflow:auto;padding:10px 0}.msg{max-width:82%;padding:12px 15px;border-radius:12px;margin:10px 0;white-space:pre-wrap;line-height:1.5}.user{margin-left:auto;background:#2855a5}.assistant{background:#172438;border:1px solid #2b3c56}.tool{background:#142f2b;border:1px solid #226351;color:#9ce8ca;font:12px monospace}.composer{display:flex;gap:9px;border-top:1px solid #26344a;padding-top:15px}.composer textarea{flex:1;resize:none;background:#121e31;color:#fff;border:1px solid #30425e;border-radius:9px;padding:12px;min-height:50px}.composer button{background:#557df4;color:#fff;border:0;border-radius:9px;padding:0 20px;cursor:pointer}.muted{color:#9aaac0;font-size:12px}</style></head><body><main><div class="top"><div><b>✦ Arena Agent Chat v0.3.0</b><div class="muted">Provider-routed tool-calling agent</div></div><a href="/">← Dashboard</a></div><div class="controls"><select id="provider"></select><select id="model"></select><select id="steps"><option value="4">4 steps</option><option value="8" selected>8 steps</option><option value="16">16 steps</option></select></div><div id="messages" class="messages"><div class="msg assistant">Hello. I can inspect files, edit the workspace and run project commands. Choose a provider and model to begin.</div></div><form id="form" class="composer"><textarea id="input" placeholder="Ask the agent to inspect or modify your project…"></textarea><button>Send</button></form></main><script>let ps=[],history=[];const $=x=>document.querySelector(x),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function load(){ps=await (await fetch(window.apiUrl('/api/providers'))).json();$('#provider').innerHTML=ps.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}${p.hasApiKey?' ✓':' (no key)'}</option>`).join('');pick();}function pick(){let p=ps.find(x=>x.id==$('#provider').value)||ps[0];$('#model').innerHTML=(p?.models||[]).map(m=>`<option value="${esc(m.id)}">${esc(m.name||m.id)}</option>`).join('')}$('#provider').onchange=pick;function add(cls,text){let d=document.createElement('div');d.className='msg '+cls;d.textContent=text;$('#messages').append(d);$('#messages').scrollTop=1e9;return d}$('#form').onsubmit=async e=>{e.preventDefault();let text=$('#input').value.trim();if(!text)return;$('#input').value='';add('user',text);history.push({role:'user',content:text});let wait=add('tool','Thinking and executing tools…');try{let p=$('#provider').value,m=$('#model').value,r=await fetch(window.apiUrl('/api/chat'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:p,model:m,messages:history,maxSteps:+$('#steps').value})});let j=await r.json();wait.remove();if(!r.ok)throw Error(j.detail||'Request failed');let out=j.message?.content||JSON.stringify(j.message);add('assistant',out);history.push(j.message)}catch(err){wait.remove();add('assistant','Error: '+err.message)}};load();</script></body></html>
