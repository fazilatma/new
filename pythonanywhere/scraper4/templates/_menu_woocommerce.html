<form id="connection-woocommerce" class="connection-form" data-name="woocommerce"><h3>ووکامرس</h3><label>آدرس فروشگاه<input name="store_url" dir="ltr" type="url" required></label><label>Consumer key<input name="consumer_key" dir="ltr" type="password" required autocomplete="off"></label><label>Consumer secret<input name="consumer_secret" dir="ltr" type="password" required autocomplete="off"></label><p data-connection-status="woocommerce" role="status"></p><fieldset><legend>تعدیل عمومی قیمت مقصد (برای همهٔ پروفایل‌ها)</legend><label>روش<select name="price_mode"><option value="none">بدون تغییر</option><option value="percent">درصد</option><option value="multiplier">ضریب</option></select></label><label>مقدار<input name="price_val" type="number" step="0.01" value="0"></label><label>گرد کردن<input name="price_round" type="number" min="0" step="1" value="0"></label><p class="muted">پس از تعدیل اختصاصی پروفایل اعمال می‌شود. ذخیره، ارسال مجدد خودکار راه نمی‌اندازد.</p></fieldset><button>ذخیره اتصال</button></form>
