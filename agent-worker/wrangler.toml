#:schema node_modules/wrangler/config-schema.json
name = "arena-agent-worker"
main = "src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# --------------------------------------------------------------------------
# Static assets (the agent Web UI). Served from ./public by the Workers
# Assets runtime. The Worker itself handles every /api/* route.
# --------------------------------------------------------------------------
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"

# --------------------------------------------------------------------------
# Plain (non-secret) configuration. Secrets go through `wrangler secret put`.
# --------------------------------------------------------------------------
[vars]
APP_VERSION = "1.0.0"
AUTH_ENABLED = "false"
REQUIRE_FILE_APPROVAL = "true"
AGENT_PROXY_ENABLED = "false"
AGENT_PROXY_URL = "https://proxy.fazilat-ma.workers.dev/?url={url}"
CORS_ORIGINS = "*"
RATE_LIMIT_PER_MINUTE = "200"
MAX_CONCURRENT_JOBS = "3"
MAX_RETRY_SLEEP_SEC = "20"
CLOUDFLARE_ACCOUNT_ID = ""

# --------------------------------------------------------------------------
# D1 — replaces the SQLite database of the Python app.
# Create with:  wrangler d1 create arena-agent-db
# then paste the returned database_id below.
# --------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "arena-agent-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# --------------------------------------------------------------------------
# R2 — replaces the local filesystem (workspaces, uploads, job artifacts).
# Create with:  wrangler r2 bucket create arena-agent-files
# --------------------------------------------------------------------------
[[r2_buckets]]
binding = "FILES"
bucket_name = "arena-agent-files"

# --------------------------------------------------------------------------
# KV — replaces data/environment.json + data/providers.json
# Create with:  wrangler kv namespace create CONFIG
# --------------------------------------------------------------------------
[[kv_namespaces]]
binding = "CONFIG"
id = "00000000000000000000000000000000"

# --------------------------------------------------------------------------
# Background job worker — replaces the asyncio `persistent_worker_loop`.
# --------------------------------------------------------------------------
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

[limits]
cpu_ms = 300000

# --------------------------------------------------------------------------
# Optional: Workers AI as an extra built-in provider (protocol = "workers-ai").
# --------------------------------------------------------------------------
# [ai]
# binding = "AI"

# --------------------------------------------------------------------------
# Optional: Browser Rendering binding. Not required — the browser tools fall
# back to the Browser Rendering REST API (needs CLOUDFLARE_ACCOUNT_ID +
# CLOUDFLARE_API_TOKEN) and finally to a pure-fetch HTML/DOM engine.
# --------------------------------------------------------------------------
# [browser]
# binding = "BROWSER"
