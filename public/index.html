<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Coding Agent</title><link rel="stylesheet" href="/style.css"></head><body><header><b>⚡ Local Coding Agent</b><span id="status">در حال اتصال…</span></header><main><aside><h3>فایل‌ها</h3><button onclick="newFile()">+ فایل</button><button onclick="newFolder()">+ پوشه</button><div id="files"></div><h3>مدل‌های محلی</h3><h3>ارائه‌دهنده‌ها</h3><input type="file" id="providerFile" accept=".json,application/json" onchange="importProviders(event)"><button onclick="exportProviders()">برون‌ریزی JSON</button><button onclick="loadProviders()">بارگذاری</button><div id="providers"></div><div id="models"></div><input id="modelUrl" placeholder="GGUF URL"><button onclick="downloadModel()">نصب</button><input id="modelName" placeholder="نام GGUF"><button onclick="launchModel()">اجرای مدل</button></aside><section class="workspace"><div class="tabs"><span id="current">بدون فایل</span><button onclick="saveFile()">ذخیره</button></div><textarea id="editor" spellcheck="false"></textarea><div class="agent"><b>AI Coding Agent</b><input id="modelUrlApi" value="http://127.0.0.1:8080/v1/chat/completions"><textarea id="prompt" placeholder="وظیفه کدنویسی را بنویس…"></textarea><button onclick="askAgent()">تحلیل</button><button onclick="runAgentLoop()">اجرای حلقه خودکار</button><label>حداکثر تکرار <input id="maxIterations" type="number" min="1" max="20" value="8"></label><pre id="answer"></pre></div></section><section class="terminal"><b>Terminal</b><input id="command" value="pwd && ls -la"><button onclick="runCommand()">اجرا</button><pre id="termout"></pre></section></main><script src="/app.js"></script></body></html>
