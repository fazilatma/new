<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arena Agent</title><style>body{font-family:system-ui;background:#0f172a;color:#e2e8f0;margin:0}main{max-width:1100px;margin:auto;padding:28px}h1{margin:0 0 20px}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}button,input{border:1px solid #334155;background:#1e293b;color:#e2e8f0;padding:9px;border-radius:7px}button{cursor:pointer;background:#2563eb;border:0}.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;margin-top:12px}.model{background:#0f172a;padding:10px;border-radius:7px}.muted{color:#94a3b8;font-size:13px}.danger{background:#b91c1c}.ok{color:#4ade80}</style></head><body><main><h1>🤖 Arena Python Agent</h1><div class="bar"><button onclick="addProvider()">Add provider</button><button onclick="document.querySelector('#file').click()">Import JSON</button><button onclick="exportJson()">Export JSON</button><input id="file" type="file" accept="application/json" hidden onchange="importJson(this.files[0])"></div><div id="app">Loading...</div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,o){let r=await fetch(u,o);if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){let ps=await api('/api/providers');document.querySelector('#app').innerHTML=ps.map(p=>`<section class="card"><div class="row"><div><h2>${esc(p.name)} <span class="muted">(${esc(p.id)})</span></h2><div class="muted">${esc(p.url)} · ${p.hasApiKey?'🔐 key configured':'⚠ no key'}</div></div><div><button onclick="editProvider('${esc(p.id)}')">Edit</button> <button class="danger" onclick="delProvider('${esc(p.id)}')">Delete</button></div></div><div class="models">${(p.models||[]).map(m=>`<div class="model"><b>${esc(m.name||m.id)}</b><div class="muted">${esc(m.id)} · tools: ${m.toolCalling?'yes':'no'} · vision: ${m.vision?'yes':'no'}</div><button onclick="editModel('${esc(p.id)}',${JSON.stringify(m).replaceAll('"','&quot;')})">Edit</button> <button class="danger" onclick="delModel('${esc(p.id)}','${esc(m.id)}')">Delete</button></div>`).join('')}</div><button style="margin-top:12px" onclick="addModel('${esc(p.id)}')">Add model</button></section>`).join('')}
async function addProvider(){let id=prompt('Provider id');if(!id)return;let name=prompt('Name',id),url=prompt('Base URL','https://api.example.com/v1');await api('/api/providers/'+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,name,vendor:id,url,enabled:false,models:[]})});load()}
async function editProvider(id){let p=(await api('/api/providers')).find(x=>x.id===id);let name=prompt('Name',p.name),url=prompt('Base URL',p.url);if(name&&url)await api('/api/providers/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...p,name,url,apiKey:'',hasApiKey:undefined})});load()}
async function delProvider(id){if(confirm('Delete provider?')){await api('/api/providers/'+id,{method:'DELETE'});load()}}
async function addModel(pid){let id=prompt('Model id');if(!id)return;let name=prompt('Model name',id);await api(`/api/providers/${pid}/models`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,name,toolCalling:true,vision:false,enabled:true})});load()}
async function editModel(pid,m){let name=prompt('Model name',m.name);if(name){await api(`/api/providers/${pid}/models/${encodeURIComponent(m.id)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...m,name})});load()}}
async function delModel(pid,id){if(confirm('Delete model?')){await api(`/api/providers/${pid}/models/${encodeURIComponent(id)}`,{method:'DELETE'});load()}}
function exportJson(){location='/api/providers/export'}
async function importJson(file){let f=new FormData();f.append('file',file);await fetch('/api/providers/import',{method:'POST',body:f});load()}
load();</script></body></html>
