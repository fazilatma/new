version: '3.8'

services:
  agent:
    build: .
    container_name: arena-coding-agent
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - AGENT_ENV=production
      - AUTH_ENABLED=true
      - REQUIRE_FILE_APPROVAL=true
      - DOCKER_SANDBOX_ENABLED=false
      - MAX_CONCURRENT_JOBS=3
    volumes:
      - agent-data:/app/data
      - agent-workspace:/app/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  agent-data:
  agent-workspace:
