<!doctype html><html><head><title>Virtualized delayed catalog fixture</title></head><body>
<!-- At each timestamp a virtualized viewport REPLACES its prior cards.
     A slow in-flight fetch bridges the 15-second gap before the last batch. -->
<template data-at="0"><article class="product"><h2>First shoe</h2><a href="https://shop.example/p/1">View</a><span class="price">1000</span><img src="https://shop.example/1.jpg"></article></template>
<template data-at="1500"><article class="product"><h2>Second shoe</h2><a href="https://shop.example/p/2">View</a><span class="price">2000</span><img src="https://shop.example/2.jpg"></article></template>
<template data-at="2500"><article class="product"><h2>Third shoe</h2><a href="https://shop.example/p/3">View</a><span class="price">3000</span><img src="https://shop.example/3.jpg"></article></template>
<template data-at="17500"><article class="product"><h2>Fourth shoe</h2><a href="https://shop.example/p/4">View</a><span class="price">4000</span><img src="https://shop.example/4.jpg"></article></template>
</body></html>
