name: Syntax Check

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm install --ignore-scripts
      - name: Runtime smoke test
        run: |
          set -e
          PORT=3137 HOST=127.0.0.1 WORKSPACE_ROOT="$RUNNER_TEMP/arena-workspace" MODELS_ROOT="$RUNNER_TEMP/arena-models" node server/index.js >/tmp/arena-agent.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 2
          if ! kill -0 $PID 2>/dev/null; then
            echo "Arena server exited during startup."
            cat /tmp/arena-agent.log || true
            exit 1
          fi
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:3137/api/health >/tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          curl --fail --silent --show-error http://127.0.0.1:3137/api/project/commands >/tmp/project-commands.json
          grep -q '"commands"' /tmp/project-commands.json
          grep -q '"node-check"' /tmp/project-commands.json
