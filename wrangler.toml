# ─── حسابدار فروش | Cloudflare Worker ──────────────────────────────
name = "hesabdar"
main = "dist/worker.js"
compatibility_date = "2025-06-01"

# برای اتصال دیتابیس دائمی، ابتدا بسازید:
#   npx wrangler d1 create hesabdar-db
# بعد database_id را جای‌گذاری و این بخش را از کامنت خارج کنید:
#
# [[d1_databases]]
# binding = "DB"
# database_name = "hesabdar-db"
# database_id = "PASTE_YOUR_DATABASE_ID_HERE"

[vars]
APP_NAME = "hesabdar"

# سینک خودکار ساعتی اتصال‌ها (اختیاری):
# ۱) در برنامه، تیک «خودکار» اتصال را روشن کنید
# ۲) این بخش را از کامنت خارج کنید و دوباره دیپلوی کنید
# [triggers]
# crons = ["0 * * * *"]
