# ─── حسابدار فروش | Cloudflare Worker ──────────────────────────────
name = "hesabdar"
main = "dist/worker.js"
compatibility_date = "2025-06-01"

# دیتابیس D1 الزامی است (بدون آن هیچ داده‌ای ذخیره نمی‌شود):
#   npx wrangler d1 create hesabdar-db
# بعد database_id را جای‌گذاری و این بخش را از کامنت خارج کنید:
#
# [[d1_databases]]
# binding = "DB"
# database_name = "hesabdar-db"
# database_id = "PASTE_YOUR_DATABASE_ID_HERE"

[vars]
APP_NAME = "hesabdar"

# سینک خودکار ساعتی اتصال‌هایی که تیک «خودکار» دارند:
[triggers]
crons = ["0 * * * *"]
