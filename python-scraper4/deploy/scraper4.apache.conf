# scraper4-put BEGIN
# Python Scraper4 on gunicorn :8000, public URL /put/
# Deployer4 on gunicorn :8001, public URL /deploy/
# Apache DocumentRoot stays PHP. Do NOT ProxyPass /.
<IfModule mod_proxy.c>
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 3600
    RequestHeader set X-Forwarded-Proto "http"
    RedirectMatch 301 ^/put$ /put/
    ProxyPass /put/ http://127.0.0.1:8000/
    ProxyPassReverse /put/ http://127.0.0.1:8000/
    RedirectMatch 301 ^/deploy$ /deploy/
    ProxyPass /deploy/ http://127.0.0.1:8001/
    ProxyPassReverse /deploy/ http://127.0.0.1:8001/
</IfModule>
# scraper4-put END
