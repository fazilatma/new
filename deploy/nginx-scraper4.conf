# ============================================================================
#  بلوکِ سرور Nginx برای scraper4 — جلوی PHP-FPM (چندپروسهٔ تولید)
# ----------------------------------------------------------------------------
#  این فایل را در /etc/nginx/conf.d/scraper4.conf کپی کنید و مسیرها/دامنه را
#  با سرور خود هماهنگ کنید، سپس: nginx -t && systemctl reload nginx
#
#  جفتِ Nginx+FPM لایهٔ دومِ تاب‌آوری است: خودِ FPM مسترِ فرزندساز دارد
#  (سگفالتِ یک کارگر هیچ‌کدام از کارگرهای دیگر را لمس نمی‌کند) و systemd
#  واحدِ php-fpm را با Restart=always زنده نگه می‌دارد.
# ============================================================================

upstream scraper4_fpm {
    server unix:/run/php/scraper4-fpm.sock;
    # درصورت اتصال با TCP (FPM روی ماشین دیگر):
    # server 127.0.0.1:9000;
    keepalive 4;
}

server {
    listen 80;
    server_name scraper4.example.com;

    # مسیرِ ریشهٔ همین ریپو روی سرور
    root /var/www/scraper4;
    index index.php index.html;

    # آپلودهای خروجی/بازگردانی
    client_max_body_size 64m;

    # ------------------------------------------------ همه درخواست‌ها به اپ واحد
    location / {
        try_files $uri $uri/ /scraper4.php$is_args$args;
    }

    location ~ \.php$ {
        # فقط فایلِ اصلی سرو شود (جلوگیری از اجرای فایل‌های ابزاری غیروبی)
        if ($uri !~ ^/(scraper4|deploy)\.php$) { return 404; }

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass scraper4_fpm;

        # ------- بخش حیاتی برای استریم SSE و درخواست‌های طولانی -------
        # بافر را خاموش کن تا رویدادهای SSE بلادرنگ به مرورگر برسند
        fastcgi_buffering off;
        gzip off;                  # gzip هم خروجی را نگه می‌دارد، برای SSE بد است
        # خط X-Accel-Buffering: no در اپ هم گذاشته شده، ولی این‌جا هم بیمه می‌کنیم
        fastcgi_request_buffering on;

        # SSE/استخراج دقایق زیاد طول می‌کشد — FPM با request_terminate_timeout=0
        # نمی‌کشد، پس این‌جا هم سقف را بلند می‌گذاریم
        fastcgi_read_timeout 3600s;
        fastcgi_send_timeout 300s;
        fastcgi_connect_timeout 30s;

        # اگر کارگری درمیانهٔ پاسخ مرد، به کارگر دیگر سپرده نشود — چون SSE
        # قابلیت بازپخش ندارد و دوباره‌فرستادن می‌تواند داده را دو مرتبه کند
        fastcgi_next_upstream off;
    }

    # فایل‌های دیتای حساس هرگز وب‌پذیر نیستند
    location ~ (\.json$|\.lock$|connections|profiles|sync_state) {
        deny all;
        return 404;
    }
    location ~ /\.(git|env) { deny all; return 404; }

    access_log /var/log/nginx/scraper4-access.log;
    error_log  /var/log/nginx/scraper4-error.log warn;
}
