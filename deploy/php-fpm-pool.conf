; ============================================================================
;  استخرِ PHP-FPM برای scraper4 — چندپروسهٔ واقعیِ تولید
; ----------------------------------------------------------------------------
;  این فایل را در مسیر استخرهای FPM کپی کنید:
;      Ubuntu/Debian:  /etc/php/8.2/fpm/pool.d/scraper4.conf
;      RHEL/Alma:      /etc/php-fpm.d/scraper4.conf
;  سپس:  systemctl reload php8.2-fpm   (یا نسخهٔ متناظر)
;
;  چرا FPM؟ سرورِ داخلیِ PHP (server.sh) برای متوسط‌بار عالی است، ولی FPM یک
;  «مسترِ ارشد» دارد که کارگرها را خودِ PHP می‌سازد و می‌کشد: اگر یک کارگر
;  سگفالت کند یا حافظه‌اش خراب شود، master بلافاصلی جانشین می‌سازد و
;  درخواست‌های کارگرهای دیگر هرگز قطع نمی‌شوند. با pm.max_requests هر کارگر
;  بعد از N درخواست سالم بازسازی می‌شود تا نشتِ حافظهٔ بلندمدت بیمه شود.
; ============================================================================

[scraper4]
; کاربرِ وب‌سرور را متناسب با سیستم خود عوض کنید
user  = www-data
group = www-data

; سوکتِ یونیکس — همین را در بلوک nginx (fastcgi_pass) هم بگذارید
listen = /run/php/scraper4-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; --- مدیریتِ چندپروسه‌ای --------------------------------------------------
; dynamic: کارگرها با بارِ لحظه‌ای رشد می‌کنند و بعدِ خلوت‌شدن پس گرفته می‌شوند.
; تخمین pm.max_children: (RAM آزادِ ماشین MB) تقسیم‌بر (حافظهٔ هر کارگر ≈ 60–100MB)
pm = dynamic
pm.max_children      = 12
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; بازسازیِ پیش‌دستانهٔ کارگر: در برابر نشتِ حافظهٔ انباشته (صفیحِ صفحات بزرگ)
pm.max_requests = 500

; --- مهلت‌ها --------------------------------------------------------------
; صفر = خودِ FPM هرگز درخواست را به‌خاطر طولانی‌بودن نمی‌کشد. الزامی است چون
; استریم SSE و استخراجِ چندصفحه‌ای ممکن است دقایقی طول بکشد. مهارِ واقعی را
; اپ خودش و حلقهٔ نگهبانِ server.sh / سلامتِ nginx کنترل می‌کند.
request_terminate_timeout = 0

; اگر خروجی آرام SSE کند شد، FPM به زمان فلاش توجه نکند
request_slowlog_timeout = 0
; slowlog = /var/log/php-fpm/scraper4-slow.log

; --- محدودهٔ منابعِ هر کارگر ----------------------------------------------
php_admin_value[memory_limit]  = 512M
php_admin_value[max_execution_time] = 0
php_admin_value[ignore_user_abort]  = On
php_admin_value[default_socket_timeout] = -1
php_admin_value[max_input_time]    = -1
php_admin_value[post_max_size]     = 64M
php_admin_value[upload_max_filesize] = 64M

; OPcache — برای فایلِ ۵+ مگابایتی scraper4.php تأثیر چشمگیری دارد
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 192
php_admin_value[opcache.interned_strings_buffer] = 24
php_admin_value[opcache.max_accelerated_files] = 10000

; لاگ خطاهای هر کارگر
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = On
php_admin_value[error_log] = /var/log/php-fpm/scraper4-error.log
